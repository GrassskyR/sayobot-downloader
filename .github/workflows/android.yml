name: Android CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build, lint, and unit test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Verify debug build
        run: ./gradlew --no-daemon :app:lintDebug :app:testDebugUnitTest :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: verification-reports
          path: |
            app/build/reports/**
            app/build/test-results/**
          retention-days: 14

  instrumentation:
    name: Instrumentation tests
    runs-on: macos-latest
    if: github.event_name != 'pull_request'
    needs: verify

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run connected tests
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: ${{ runner.arch == 'ARM64' && 'arm64-v8a' || 'x86_64' }}
          script: ./gradlew --no-daemon :app:connectedDebugAndroidTest

      - name: Upload instrumentation reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: instrumentation-reports
          path: |
            app/build/reports/**
            app/build/outputs/androidTest-results/**
          retention-days: 14
