name: Android Release

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: Release version name, for example 1.0.1
        required: true
        type: string
      version_code:
        description: Android version code, for example 2
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build signed release APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Validate release inputs and secrets
        env:
          VERSION_CODE: ${{ inputs.version_code }}
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          [[ "$VERSION_CODE" =~ ^[0-9]+$ ]]
          test -n "$RELEASE_KEYSTORE_BASE64"
          test -n "$RELEASE_KEYSTORE_PASSWORD"
          test -n "$RELEASE_KEY_ALIAS"
          test -n "$RELEASE_KEY_PASSWORD"

      - name: Decode release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"

      - name: Build release APK
        env:
          RELEASE_STORE_FILE: ${{ runner.temp }}/release.jks
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          VERSION_NAME: ${{ inputs.version_name }}
          VERSION_CODE: ${{ inputs.version_code }}
        run: |
          ./gradlew --no-daemon \
            -PversionName="$VERSION_NAME" \
            -PversionCode="$VERSION_CODE" \
            :app:lintRelease \
            :app:testDebugUnitTest \
            :app:assembleRelease

      - name: Collect release APKs
        env:
          VERSION_NAME: ${{ inputs.version_name }}
        run: |
          mkdir -p release
          declare -A APK_NAMES=(
            ["app-armeabi-v7a-release.apk"]="SayobotDownloader-$VERSION_NAME-armeabi-v7a.apk"
            ["app-arm64-v8a-release.apk"]="SayobotDownloader-$VERSION_NAME-arm64-v8a.apk"
            ["app-x86-release.apk"]="SayobotDownloader-$VERSION_NAME-x86.apk"
            ["app-x86_64-release.apk"]="SayobotDownloader-$VERSION_NAME-x86_64.apk"
            ["app-universal-release.apk"]="SayobotDownloader-$VERSION_NAME-universal.apk"
          )

          for source_name in "${!APK_NAMES[@]}"; do
            cp "app/build/outputs/apk/release/$source_name" "release/${APK_NAMES[$source_name]}"
          done

          ls -lh release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version_name }}
          name: Sayobot Downloader ${{ inputs.version_name }}
          files: release/*.apk
          fail_on_unmatched_files: true
